<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tech-ಶೋಧ — A Hackathon for a Brighter Tomorrow, VVCE Mysuru.">
  <title>Tech-ಶೋಧ | Hackathon</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#05030b;overflow:hidden}
    body{font-family:Arial,Helvetica,sans-serif}

    .page{position:relative;width:100vw;height:100vh;background:#05030b}

    video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      background:#05030b;
    }

    /* Keeps the video clear without covering its text. */
    .shade{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(to bottom,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 55%,rgba(0,0,0,.22) 100%);
    }

    /* Only this button is added to the video. */
    .register-wrap{
      position:absolute;
      left:50%;
      bottom:7%;
      transform:translate(-50%,20px);
      opacity:0;
      pointer-events:none;
      z-index:5;
      transition:opacity .8s ease,transform .8s ease;
    }

    .register-wrap.show{
      opacity:1;
      transform:translate(-50%,0);
      pointer-events:auto;
    }

    .register-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:245px;
      padding:16px 30px;
      border-radius:999px;
      border:0;
      text-decoration:none;
      font-size:18px;
      font-weight:700;
      color:#160812;
      background:linear-gradient(135deg,#ffc857,#ff5fa8);
      box-shadow:0 12px 40px rgba(255,95,168,.35);
      transition:transform .25s ease,box-shadow .25s ease;
    }

    .register-btn:hover{
      transform:translateY(-4px) scale(1.03);
      box-shadow:0 18px 50px rgba(255,95,168,.5);
    }

    .register-btn:focus-visible{
      outline:3px solid #3ee6f2;
      outline-offset:5px;
    }

    @media(max-width:600px){
      .register-wrap{bottom:5%}
      .register-btn{min-width:220px;padding:14px 24px;font-size:16px}
    }
  </style>
</head>
<body>
  <main class="page">
    <video id="hackathonVideo" autoplay playsinline preload="auto">
      <source src="Tech-Shodha-final-updated.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <div class="shade"></div>

    <div id="registerWrap" class="register-wrap">
      <a
        class="register-btn"
        href="https://docs.google.com/forms/d/e/1FAIpQLSc0ZMLrS-nh4fjTwqAL6h6wVqwx6gCeBfIiOUt_RNfoxa9ykg/viewform?usp=header"
        target="_blank"
        rel="noopener noreferrer">
        Register Your Team
      </a>
    </div>
  </main>

  <script>
    const video = document.getElementById('hackathonVideo');
    const registerWrap = document.getElementById('registerWrap');

    // Show the registration button only after the video finishes.
    video.addEventListener('ended', () => {
      registerWrap.classList.add('show');
    });

    // Try to start with sound. Modern browsers may block autoplay with sound.
    // If blocked, autoplay continues muted and the first user interaction enables sound.
    async function startVideo() {
      video.muted = false;
      try {
        await video.play();
      } catch (error) {
        video.muted = true;
        try { await video.play(); } catch (e) {}
      }
    }

    // A normal user interaction is allowed to enable audio without adding
    // another button or covering any text in the video.
    function enableSound() {
      video.muted = false;
      video.volume = 1;
      video.play().catch(() => {});
    }

    window.addEventListener('load', startVideo);
    document.addEventListener('click', enableSound, { once: true });
    document.addEventListener('touchstart', enableSound, { once: true, passive: true });
    document.addEventListener('keydown', enableSound, { once: true });
  </script>
</body>
</html>
